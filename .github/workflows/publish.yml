name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  # Manueller Start ohne Tag-Push: erlaubt das Ausloesen eines Releases
  # ueber die GitHub-Oberflaeche bzw. -API (z. B. wenn der Tag in einer
  # eingeschraenkten Umgebung nicht gepusht werden kann). Die zu
  # veroeffentlichende Version ergibt sich weiterhin aus pyproject.toml.
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # Nur von main oder einem Release-Tag veroeffentlichen. Verhindert, dass
    # ein manueller workflow_dispatch gegen einen beliebigen Branch dessen
    # pyproject.toml-Version zu PyPI hochlaedt (umgeht sonst das Tag-Gate).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: pypi          # muss mit PyPI Trusted Publisher übereinstimmen
    permissions:
      id-token: write          # OIDC – kein API-Token nötig
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build hatchling

      - name: Build package (sdist + wheel)
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Kein Passwort / kein API-Token – läuft über Trusted Publisher (OIDC)
        with:
          # Bereits hochgeladene Dateien (z. B. bei einem Re-Run desselben
          # Tags) überspringen, statt mit "400 File already exists" rot zu
          # werden. PyPI erlaubt keinen Re-Upload einer existierenden Version.
          skip-existing: true

  publish-mcp:
    name: Publish to MCP Registry
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Sync server.json version to the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
