name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  # Manueller Start ohne Tag-Push: erlaubt das Ausloesen eines Releases
  # ueber die GitHub-Oberflaeche bzw. -API (z. B. wenn der Tag in einer
  # eingeschraenkten Umgebung nicht gepusht werden kann). Die zu
  # veroeffentlichende Version ergibt sich weiterhin aus pyproject.toml.
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi          # muss mit PyPI Trusted Publisher übereinstimmen
    permissions:
      id-token: write          # OIDC – kein API-Token nötig
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build hatchling

      - name: Build package (sdist + wheel)
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Kein Passwort / kein API-Token – läuft über Trusted Publisher (OIDC)
        with:
          # Bereits hochgeladene Dateien (z. B. bei einem Re-Run desselben
          # Tags) überspringen, statt mit "400 File already exists" rot zu
          # werden. PyPI erlaubt keinen Re-Upload einer existierenden Version.
          skip-existing: true
